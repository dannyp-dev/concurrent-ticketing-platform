services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ticketing
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: local-ticketing-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ticketing-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  ticketing-postgres:
